<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood Wallpaper Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0a0a12;
  }

  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
  }

  .ui {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
    padding: 10px;
    background: rgba(10, 10, 18, 0.45);
    backdrop-filter: blur(12px);
    border-radius: 40px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .mood-btn {
    padding: 10px 20px;
    border-radius: 30px;
    border: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.65);
    font-size: 14px;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all 0.35s ease;
  }

  .mood-btn:hover { color: #fff; }

  .mood-btn.active {
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
  }

  .sound-toggle {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 10;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(10, 10, 18, 0.45);
    backdrop-filter: blur(12px);
    color: rgba(255, 255, 255, 0.8);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s ease;
  }

  .sound-toggle:hover { background: rgba(255, 255, 255, 0.12); }

  .title {
    position: fixed;
    top: 28px;
    left: 30px;
    z-index: 10;
    color: rgba(255, 255, 255, 0.85);
    font-size: 15px;
    letter-spacing: 1px;
    font-weight: 300;
  }

  .title span {
    display: block;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  @media (max-width: 480px) {
    .ui { gap: 4px; padding: 6px; }
    .mood-btn { padding: 8px 12px; font-size: 12px; }
    .title { font-size: 13px; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="title">Mood Wallpaper<span id="moodLabel">chill mode</span></div>

<button class="sound-toggle" id="soundToggle" title="Toggle ambient sound">&#128264;</button>

<div class="ui">
  <button class="mood-btn active" data-mood="chill">chill</button>
  <button class="mood-btn" data-mood="study">study</button>
  <button class="mood-btn" data-mood="rainy">rainy</button>
  <button class="mood-btn" data-mood="energetic">energetic</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ---------- Mood configuration ----------
const moods = {
  chill: {
    bg: ['#1b1b3a', '#0e0e24'],
    particleColor: ['#a3a1ff', '#7f9cf5', '#c9c4ff'],
    count: 40,
    label: 'chill mode'
  },
  study: {
    bg: ['#2b2013', '#170f08'],
    particleColor: ['#ffd9a0', '#ffbb6b', '#fff2d8'],
    count: 55,
    label: 'study mode'
  },
  rainy: {
    bg: ['#1c232e', '#0b0f15'],
    particleColor: ['#9db4d1', '#6f89a8', '#c3d4e6'],
    count: 120,
    label: 'rainy mode'
  },
  energetic: {
    bg: ['#2a0e2e', '#12041a'],
    particleColor: ['#ff5fa8', '#ffb020', '#5fe0ff'],
    count: 60,
    label: 'energetic mode'
  }
};

let currentMood = 'chill';
let particles = [];

// ---------- Particle system ----------
function makeParticle(mood) {
  const cfg = moods[mood];
  const color = cfg.particleColor[Math.floor(Math.random() * cfg.particleColor.length)];

  if (mood === 'rainy') {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      len: 12 + Math.random() * 18,
      speed: 8 + Math.random() * 10,
      color,
      alpha: 0.3 + Math.random() * 0.4
    };
  }

  if (mood === 'energetic') {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 2.5;
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: 2 + Math.random() * 5,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      color,
      pulse: Math.random() * Math.PI * 2
    };
  }

  // chill + study: soft floating orbs
  return {
    x: Math.random() * W,
    y: Math.random() * H,
    r: 20 + Math.random() * 60,
    baseR: 20 + Math.random() * 60,
    driftX: (Math.random() - 0.5) * 0.3,
    driftY: -0.15 - Math.random() * 0.25,
    color,
    alpha: 0.06 + Math.random() * 0.1,
    phase: Math.random() * Math.PI * 2
  };
}

function initParticles(mood) {
  const cfg = moods[mood];
  particles = Array.from({ length: cfg.count }, () => makeParticle(mood));
}

initParticles(currentMood);

// ---------- Background gradient ----------
function drawBackground(mood) {
  const cfg = moods[mood];
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, cfg.bg[0]);
  g.addColorStop(1, cfg.bg[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

let time = 0;
let flashAlpha = 0;

function update(mood) {
  time += 0.016;

  if (mood === 'rainy') {
    // occasional soft lightning flash
    if (Math.random() < 0.0025) flashAlpha = 0.15;
    flashAlpha *= 0.9;
  }

  particles.forEach(p => {
    if (mood === 'rainy') {
      p.y += p.speed;
      p.x -= p.speed * 0.15;
      if (p.y > H) { p.y = -20; p.x = Math.random() * W; }
      if (p.x < -20) p.x = W + 20;
    } else if (mood === 'energetic') {
      p.x += p.vx;
      p.y += p.vy;
      p.pulse += 0.08;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    } else {
      p.x += p.driftX + Math.sin(time * 0.3 + p.phase) * 0.15;
      p.y += p.driftY;
      p.r = p.baseR + Math.sin(time * 0.5 + p.phase) * 6;
      if (p.y < -p.r) { p.y = H + p.r; p.x = Math.random() * W; }
    }
  });
}

function render(mood) {
  drawBackground(mood);

  if (mood === 'rainy') {
    ctx.lineCap = 'round';
    particles.forEach(p => {
      ctx.strokeStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + 3, p.y + p.len);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
    if (flashAlpha > 0.01) {
      ctx.fillStyle = `rgba(200, 210, 255, ${flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
    }
  } else if (mood === 'energetic') {
    particles.forEach(p => {
      const pulseR = p.r + Math.sin(p.pulse) * 2;
      ctx.beginPath();
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.8;
      ctx.arc(p.x, p.y, Math.max(pulseR, 1), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.15;
      ctx.beginPath();
      ctx.arc(p.x, p.y, pulseR * 3, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  } else {
    particles.forEach(p => {
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      grad.addColorStop(0, p.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
}

function loop() {
  update(currentMood);
  render(currentMood);
  requestAnimationFrame(loop);
}
loop();

// ---------- Mood switching ----------
const buttons = document.querySelectorAll('.mood-btn');
const moodLabel = document.getElementById('moodLabel');

buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMood = btn.dataset.mood;
    moodLabel.textContent = moods[currentMood].label;
    initParticles(currentMood);
    if (audioStarted) startMoodAudio(currentMood);
  });
});

// ---------- Ambient generative audio (Web Audio API, no external files) ----------
let audioCtx = null;
let audioStarted = false;
let soundOn = false;
let activeNodes = [];

function stopAllAudio() {
  activeNodes.forEach(n => {
    try { n.stop ? n.stop() : n.disconnect(); } catch (e) {}
  });
  activeNodes = [];
}

function makeNoiseBuffer(ctx) {
  const bufferSize = 2 * ctx.sampleRate;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  return buffer;
}

function startMoodAudio(mood) {
  if (!audioCtx) return;
  stopAllAudio();

  const master = audioCtx.createGain();
  master.gain.value = 0.18;
  master.connect(audioCtx.destination);
  activeNodes.push(master);

  if (mood === 'chill') {
    [220, 277, 330].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const gain = audioCtx.createGain();
      gain.gain.value = 0.08;
      osc.connect(gain).connect(master);
      osc.start();
      activeNodes.push(osc, gain);
    });
  } else if (mood === 'study') {
    const noise = audioCtx.createBufferSource();
    noise.buffer = makeNoiseBuffer(audioCtx);
    noise.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 500;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.25;
    noise.connect(filter).connect(gain).connect(master);
    noise.start();
    activeNodes.push(noise, filter, gain);
  } else if (mood === 'rainy') {
    const noise = audioCtx.createBufferSource();
    noise.buffer = makeNoiseBuffer(audioCtx);
    noise.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1800;
    filter.Q.value = 0.6;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.35;
    noise.connect(filter).connect(gain).connect(master);
    noise.start();
    activeNodes.push(noise, filter, gain);
  } else if (mood === 'energetic') {
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = 110;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.0001;
    osc.connect(gain).connect(master);
    osc.start();
    activeNodes.push(osc, gain);

    const pulse = () => {
      if (!soundOn || currentMood !== 'energetic') return;
      const now = audioCtx.currentTime;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
      setTimeout(pulse, 400);
    };
    pulse();
  }
}

const soundToggle = document.getElementById('soundToggle');
soundToggle.addEventListener('click', () => {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();

  soundOn = !soundOn;
  audioStarted = true;
  soundToggle.innerHTML = soundOn ? '&#128266;' : '&#128264;';

  if (soundOn) {
    startMoodAudio(currentMood);
  } else {
    stopAllAudio();
  }
});
</script>

</body>
</html>
